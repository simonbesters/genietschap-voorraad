{% extends "base.html" %}
{% block title %}Inloggen{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center">
    <div class="text-center mb-8">
        <div class="text-4xl mb-3">🍾</div>
        <h1 class="text-2xl font-semibold text-gray-900">Genietschap</h1>
        <p class="text-sm text-gray-500 mt-1 uppercase tracking-widest">Voorraadbeheer</p>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Gebruikersnaam</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                       class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
            </div>
            <div>
                <label for="password" class="block text-xs font-medium text-gray-500 uppercase tracking-wide mb-1.5">Wachtwoord</label>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                       class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
            </div>
            <button type="submit" class="w-full py-2.5 bg-gray-900 text-white text-sm font-medium rounded-lg hover:bg-gray-800 active:bg-gray-950">
                Inloggen
            </button>
        </form>
    </div>
</div>
{% endblock %}
