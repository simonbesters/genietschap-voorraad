{% extends "base.html" %}
{% block title %}Reden{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex flex-col">
    <a href="{{ url_for('inventory') }}" class="text-sm text-gray-500 hover:text-gray-700 mb-8">&larr; Terug</a>

    <h1 class="text-2xl font-semibold mb-2">Waarvoor neem je flessen mee?</h1>
    <p class="text-sm text-gray-500 mb-8">Kies een reden, dan selecteer je de flessen.</p>

    <div class="space-y-3 mb-6">
        <a href="{{ url_for('withdrawal_select', reden='proeverij') }}"
           class="flex items-center gap-3 p-5 bg-white border-2 border-gray-200 rounded-xl hover:border-gray-400 active:bg-gray-50">
            <span class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-xl">🍷</span>
            <span class="font-semibold">Proeverij</span>
        </a>
        <a href="{{ url_for('withdrawal_select', reden='vergadering') }}"
           class="flex items-center gap-3 p-5 bg-white border-2 border-gray-200 rounded-xl hover:border-gray-400 active:bg-gray-50">
            <span class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center text-xl">📋</span>
            <span class="font-semibold">Vergadering</span>
        </a>
    </div>

    <form class="flex gap-2" id="custom-form">
        <input type="text" id="custom-input" placeholder="Of typ een eigen reden..."
               class="flex-1 px-3 py-3 text-sm border border-gray-200 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-gray-900 focus:border-transparent">
        <button type="submit"
                class="px-5 py-3 bg-gray-900 text-white text-sm font-semibold rounded-lg hover:bg-gray-800 active:bg-gray-950">
            Ga door
        </button>
    </form>
</div>

<script>
document.getElementById('custom-form').addEventListener('submit', function(e) {
    e.preventDefault();
    var val = document.getElementById('custom-input').value.trim();
    if (!val) return;
    window.location.href = '{{ url_for("withdrawal_select") }}?reden=overig&tekst=' + encodeURIComponent(val);
});
</script>
{% endblock %}
